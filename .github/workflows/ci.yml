# sqdrive: build and test with clang and libc++ 23 from apt.llvm.org
# (Ubuntu 24.04's own clang is 18), the version sqterm's packages carry.
name: ci

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM: 23

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: clang and libc++ ${{ env.LLVM }}
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-$LLVM main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -q
          sudo apt-get install --yes --no-install-recommends make clang-$LLVM lld-$LLVM \
            libc++-$LLVM-dev libc++abi-$LLVM-dev
          /usr/lib/llvm-$LLVM/bin/clang++ --version | head -n 1

      - name: Build and test
        run: make -j4 CXX=/usr/lib/llvm-$LLVM/bin/clang++ test
