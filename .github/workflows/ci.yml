# sqdrive: build and test with clang and libc++ 23 from apt.llvm.org
# (Ubuntu 24.04's own clang is 18), the version sqterm's packages carry, and
# sqmake (bootstrapped from its source: no make).
name: ci

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM: 23

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: clang and libc++ ${{ env.LLVM }}
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-$LLVM main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -q
          sudo apt-get install --yes --no-install-recommends clang-$LLVM lld-$LLVM \
            libc++-$LLVM-dev libc++abi-$LLVM-dev
          /usr/lib/llvm-$LLVM/bin/clang++ --version | head -n 1

      - name: sqmake, from its source (tools/bootstrap.sh)
        run: |
          export CXX=/usr/lib/llvm-$LLVM/bin/clang++ CC=/usr/lib/llvm-$LLVM/bin/clang
          git clone --depth 1 https://github.com/squared-netizen/sqmake "$RUNNER_TEMP/sqmake"
          (cd "$RUNNER_TEMP/sqmake" && sh tools/bootstrap.sh)
          echo "$RUNNER_TEMP/sqmake/build" >> "$GITHUB_PATH"

      - name: Build and test
        run: |
          export CXX=/usr/lib/llvm-$LLVM/bin/clang++ CC=/usr/lib/llvm-$LLVM/bin/clang
          sqmake test
